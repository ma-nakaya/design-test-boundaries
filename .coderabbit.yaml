# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ja-JP
tone_instructions: >-
  簡潔で具体的な日本語で、問題の理由と最小限の修正案を示してください。
  根拠のない推測や、変更目的と無関係な指摘は避けてください。
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  review_details: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 5
    ignore_title_keywords:
      - WIP
      - "[WIP]"
      - DO NOT MERGE
    ignore_usernames:
      - "dependabot[bot]"
      - "renovate[bot]"
  path_instructions:
    - path: README.md
      instructions: |
        - 導入・更新コマンドが、記載された対象エージェントと配置先に一致するか確認してください。
        - リポジトリ構成、ライセンス、公式資料へのリンク切れや記述の不一致を指摘してください。
        - 文体上の好みだけに基づく指摘は避け、利用者の誤操作につながる問題を優先してください。
    - path: skills/**/SKILL.md
      instructions: |
        - Agent Skills仕様への適合を確認してください。特にfrontmatter、nameと親ディレクトリ名の一致、descriptionの明確さと長さ、参照ファイルの存在を検証してください。
        - 手順が技術非依存であり、特定技術の詳細が必要時だけ参照される構造を維持しているか確認してください。
        - 個別プロジェクト固有の名称、機密情報、再利用を妨げる前提が混入していないか確認してください。
    - path: skills/**/references/**
      instructions: |
        - SKILL.mdからの参照と内容が一致し、重複や矛盾、欠落した判断基準がないか確認してください。
        - テストレベル、境界、ケース設計、テストダブルの選択基準が実行可能な形で説明されているか確認してください。

  tools:
    markdownlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
